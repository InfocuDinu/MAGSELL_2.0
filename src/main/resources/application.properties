spring.application.name=BakeryManager

# Database Configuration
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:bakery.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

# Production Settings - SQL Logging OFF in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool - Optimized for SQLite
# Note: SQLite supports only one writer at a time, but multiple readers
# Pool size >1 is beneficial for read-heavy operations
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration
logging.level.root=INFO
logging.level.com.bakerymanager=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/bakery-manager.log
logging.file.max-size=10MB
logging.file.max-history=30

# Backup & Recovery
backup.scheduler.fixed-delay-ms=${BACKUP_SCHEDULER_DELAY_MS:60000}
app.settings.file=${APP_SETTINGS_FILE:config.properties}

# Performance tuning
spring.cache.type=caffeine
spring.cache.cache-names=productsAll,productsActive,productsAvailable,productsLowStock,productsById,productsByBarcode,ingredientsAll,ingredientsAvailable,ingredientsLowStock,ingredientsById,ingredientsByBarcode
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=120s,recordStats
app.performance.monitor.enabled=${APP_PERFORMANCE_MONITOR_ENABLED:true}
app.performance.monitor.slow-threshold-ms=${APP_PERFORMANCE_SLOW_THRESHOLD_MS:250}
app.performance.monitor.report-interval-ms=${APP_PERFORMANCE_REPORT_INTERVAL_MS:300000}

# Security hardening
app.security.require-env-secrets=${APP_SECURITY_REQUIRE_ENV_SECRETS:false}
app.security.master-key=${APP_SECURITY_MASTER_KEY:}
app.security.master-key-id=${APP_SECURITY_MASTER_KEY_ID:unset}
app.security.master-key-rotated-at=${APP_SECURITY_MASTER_KEY_ROTATED_AT:}
app.security.max-key-age-days=${APP_SECURITY_MAX_KEY_AGE_DAYS:90}

# SmartBill API v2
smartbill.api.base-url=${SMARTBILL_API_BASE_URL:https://ws.smartbill.ro/SBORO/api}
smartbill.api.stock-document-path=${SMARTBILL_API_STOCK_DOCUMENT_PATH:/stock/v2/documents}
smartbill.api.email=${SMARTBILL_EMAIL:}
smartbill.api.token=${SMARTBILL_TOKEN:}
smartbill.api.company-vat-code=${SMARTBILL_COMPANY_VAT_CODE:}
smartbill.api.retry-max-attempts=${SMARTBILL_RETRY_MAX_ATTEMPTS:3}
smartbill.api.retry-initial-delay-ms=${SMARTBILL_RETRY_INITIAL_DELAY_MS:1000}
smartbill.api.timeout-ms=${SMARTBILL_TIMEOUT_MS:10000}
