# Production Environment Configuration
# Activate with: java -jar -Dspring.profiles.active=prod bakery-manager.jar

# Database Configuration - Production
spring.datasource.url=jdbc:sqlite:${DATABASE_PATH:bakery.db}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Logging - Production
logging.level.root=WARN
logging.level.com.bakerymanager=INFO
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR

# Security
# In production, ensure proper file permissions on database and config files
spring.datasource.hikari.connection-test-query=SELECT 1

# Performance
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SmartBill API v2 - Production (set via environment variables)
smartbill.api.base-url=${SMARTBILL_API_BASE_URL:https://ws.smartbill.ro/SBORO/api}
smartbill.api.stock-document-path=${SMARTBILL_API_STOCK_DOCUMENT_PATH:/stock/v2/documents}
smartbill.api.email=${SMARTBILL_EMAIL:}
smartbill.api.token=${SMARTBILL_TOKEN:}
smartbill.api.company-vat-code=${SMARTBILL_COMPANY_VAT_CODE:}
smartbill.api.retry-max-attempts=${SMARTBILL_RETRY_MAX_ATTEMPTS:3}
smartbill.api.retry-initial-delay-ms=${SMARTBILL_RETRY_INITIAL_DELAY_MS:1000}
smartbill.api.timeout-ms=${SMARTBILL_TIMEOUT_MS:10000}
